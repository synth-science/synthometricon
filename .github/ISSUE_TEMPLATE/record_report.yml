name: "Record Report"
description: "Report a problem with a record in the Synthometricon (wrong metadata, items, scales or warnings)."
title: "Record: [Record Title]"
labels: ["record-report", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve the Synthometricon! One issue per record, please.

        **This issue is public.** The fields below were filled in by the app; please check them and describe the problem at the bottom.

  - type: markdown
    attributes:
      value: "### Record"

  - type: input
    id: record_title
    attributes:
      label: Record title
    validations:
      required: true

  - type: input
    id: doi
    attributes:
      label: DOI

  - type: input
    id: year
    attributes:
      label: Year

  - type: input
    id: language
    attributes:
      label: Language

  - type: input
    id: version
    attributes:
      label: Version

  - type: input
    id: source
    attributes:
      label: Source

  - type: input
    id: size
    attributes:
      label: Size

  - type: input
    id: warnings
    attributes:
      label: Warnings

  - type: markdown
    attributes:
      value: "### Where you found it"

  - type: input
    id: query_mode
    attributes:
      label: Query mode

  - type: textarea
    id: query
    attributes:
      label: Query

  - type: input
    id: permalink
    attributes:
      label: Permalink

  - type: input
    id: app_version
    attributes:
      label: App version

  - type: markdown
    attributes:
      value: "### Problem"

  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Describe what is incorrect or missing, and what it should be. A link to a source helps.
    validations:
      required: true
